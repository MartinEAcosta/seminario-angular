<!-- Las pills quedan siempre visibles (nada de desplegable): un filtro
     'default' suelto (ej. "Cupos disponibles") no tiene lugar en este layout
     por ahora, solo se renderizan los grupos 'hover' (categoría) y
     'compound' (precio) que sí tiene el mockup. -->
<div class="container-filter">
    @for( filter of filters(); track filter) {
        @if ( filter.type === 'hover') {
            <app-filter-option-hover [filter]="filter" />
        }
        @else if ( filter.type === 'compound') {
            <app-filter-option-price [filter]="filter" />
        }
    }
</div>
