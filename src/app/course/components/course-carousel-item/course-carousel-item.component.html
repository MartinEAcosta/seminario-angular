<div class="carousel-item">
    <figure class="thumbnail-frame" [class.is-placeholder]="!course().thumbnail_url">
        <img class="thumbnail-course" [src]="course().thumbnail_url || '/assets/thumbnail-icon.svg'" alt="">
    </figure>

    <div class="card-body">
        @if (categoryName(); as category) {
            <span class="category-pill">{{ category }}</span>
        }

        <h3 class="title">
            <a [routerLink]="['/course', id_course()]">{{ course().title }}</a>
        </h3>

        <p class="text-desc">{{ course().description }}</p>

        <div class="card-footer">
            <p class="price">
                @if( course().price !== 0 ){
                    {{ course().price | currency:'ARS':'symbol':'1.0-0' }}
                }
                @else {
                    Gratis
                }
            </p>

            <button
                type="button"
                class="btn-add"
                [class.is-added]="justAdded()"
                [attr.aria-label]="'Añadir ' + course().title + ' al carrito'"
                (click)="onAddToCart()">
                @if (justAdded()) {
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 12.5l5 5L20 6.5"/>
                    </svg>
                }
                @else {
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 4h2l1.4 10.6a2 2 0 0 0 2 1.7h8.2a2 2 0 0 0 2-1.6L20 8H6.2"/>
                        <circle cx="9.5" cy="20" r="1.4" fill="currentColor"/>
                        <circle cx="17" cy="20" r="1.4" fill="currentColor"/>
                    </svg>
                }
            </button>
        </div>
    </div>

    <p class="sr-only" role="status" aria-live="polite">
        @if (justAdded()) {
            {{ course().title }} se agregó al carrito.
        }
    </p>
</div>
