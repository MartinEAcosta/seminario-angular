<div class="cart-widget" [ngClass]="{'overlay' : isCartOpen()}" (click)="onCloseCart()">
  <div class="bg-cart" [ngClass]="{'open' : isCartOpen()}">

    <button
      type="button"
      class="container-icon"
      [attr.aria-expanded]="isCartOpen()"
      aria-controls="cart-panel-content"
      aria-label="Abrir carrito de compras"
      (click)="onToggleCart($event)">
      <img class="imgIconCart" [ngClass]="{'imgVisibility' : isCartOpen()}" src="assets/cart-icon.svg" alt="">
    </button>

    <!-- Si el carrito esta abierto se esconde el icono de notificación o en caso de que el tamaño sea distinto de 0 y este cerrado -->
    <div class="container-notification" [ngClass]="{ 'hidden': isCartOpen() || ( cart().items.size === 0 ),
                                                     'onNotification': !isCartOpen() && cart().items.size !== 0 }">
      <small aria-hidden="true">{{ cart().items.size }}</small>
      <span class="sr-only">{{ cart().items.size }} cursos en el carrito</span>
    </div>

    <div
      class="content-open"
      id="cart-panel-content"
      role="dialog"
      aria-label="Carrito de compras"
      [ngClass]="{'hidden' : !isCartOpen()}"
      (click)="$event.stopPropagation()">
      <div class="header-cart">
        <p>Mi Carrito</p>
        <button type="button" class="btn-close-cart" (click)="closeCart($event)" aria-label="Cerrar carrito">✕</button>
      </div>
      @if( cart().items.size != 0 ){
        <div class="list-courses">
          @for ( item of cart().items.values() ; track item.course.id ) {
            <app-cart-item-card [item]="item" />
          }
        </div>
      }
      @else {
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 4h2l1.4 10.6a2 2 0 0 0 2 1.7h8.2a2 2 0 0 0 2-1.6L20 8H6.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="9.5" cy="20" r="1.4" fill="currentColor"/>
            <circle cx="17" cy="20" r="1.4" fill="currentColor"/>
          </svg>
          <p class="empty-heading">Tu carrito está vacío</p>
          <p class="empty-copy">Explora los cursos disponibles y arma tu selección.</p>
          <a class="btn-empty-cta" routerLink="/explore" (click)="closeCart($event)">Explorar cursos</a>
        </div>
      }
      <div class="actions">
        <app-discount-code-input />
        <div class="container-btns">
          <button type="button" class="btn-continue" (click)="closeCart($event)">Continuar Explorando</button>
          <button type="button" class="btn-pay" [routerLink]="['payment/buy']">Finalizar Compra</button>
        </div>
      </div>
    </div>
  </div>
</div>
