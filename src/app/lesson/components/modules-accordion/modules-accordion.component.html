<div class="module-card" [class.is-open]="isDeployed()">
    <button
        type="button"
        class="module-header"
        (click)="toggleIsDeployed()"
        [attr.aria-expanded]="isDeployed()">
        <span class="module-index">{{ module().unit }}</span>
        <h3 class="module-title">{{ module().title }}</h3>
        <span class="module-lesson-count">
            {{ module().lessons.length === 1 ? '1 lección' : module().lessons.length + ' lecciones' }}
        </span>
        <svg class="chevron-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"/>
        </svg>
    </button>

    <div class="lessons-list" [class.is-open]="isDeployed()">
        <div class="lessons-inner">
        @for (lesson of module().lessons; track lesson.id) {
            <div
                class="lesson-row"
                [class.is-locked]="!isClickable()"
                (click)="isClickable() ? goToLesson(lesson.id) : null">

                <span class="lesson-icon" aria-hidden="true">
                    @switch (lesson.content_type) {
                        @case ('video') {
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="9"/>
                                <path d="M10.5 9.2v5.6l4.5-2.8-4.5-2.8z" fill="currentColor" stroke="none"/>
                            </svg>
                        }
                        @case ('document') {
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M7 3.5h7l3 3v14H7z"/>
                                <path d="M14 3.5v3h3"/>
                                <path d="M9.5 12.5h5M9.5 16h5"/>
                            </svg>
                        }
                        @default {
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M7 3.5h7l3 3v14H7z"/>
                            </svg>
                        }
                    }
                </span>

                <p class="lesson-title">{{ lesson.title }}</p>

                @if (lessonDuration(lesson.duration_minutes)) {
                    <span class="lesson-duration">{{ lessonDuration(lesson.duration_minutes) }}</span>
                }

                @if (!isClickable()) {
                    <svg class="lock-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="5.5" y="10.5" width="13" height="9" rx="1.5"/>
                        <path d="M8.5 10.5V7a3.5 3.5 0 0 1 7 0v3.5"/>
                    </svg>
                }
            </div>
        }
        </div>
    </div>
</div>
