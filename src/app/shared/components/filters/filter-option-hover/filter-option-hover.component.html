<ul class="container-hover-filter" role="group" [attr.aria-label]="filter().label">
    <li
        (click)="onClickAll()"
        class="option-filter"
        [class.is-active]="isAllActive()">
        Todas
    </li>
    @for (item of filter().value; track item.value) {
        <app-filter-option-default [filter]="item" />
    }
</ul>
