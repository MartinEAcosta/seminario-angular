<section class="container-auth">
    <div class="panel-commercial">
        <h1 class="headline">
            Tu próximo curso empieza <span class="accent">hoy</span>
        </h1>
        <p class="subtitle">{{ subtitle() }}</p>

        <ol class="steps">
            <li class="step">
                <span class="step-marker">1</span>
                <div class="step-body">
                    <h3>Explorá el catálogo</h3>
                    <p>Filtrá por categoría y precio.</p>
                </div>
            </li>
            <li class="step">
                <span class="step-marker">2</span>
                <div class="step-body">
                    <h3>Inscribite</h3>
                    <p>Pagá con Mercado Pago o empezá gratis.</p>
                </div>
            </li>
            <li class="step step-current">
                <span class="step-marker step-marker-icon">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </span>
                <div class="step-body">
                    <h3>Aprendé a tu ritmo</h3>
                    <p>Lecciones en video, cuando quieras.</p>
                </div>
            </li>
        </ol>
    </div>

    <span class="divider-ticket" aria-hidden="true"></span>

    <div class="panel-auth">
        <div class="auth-tabs" role="tablist">
            <a
                routerLink="/auth/login"
                routerLinkActive="active"
                role="tab"
                [attr.aria-selected]="!isRegisterRoute()"
                class="auth-tab"
            >
                Ingresar
            </a>
            <a
                routerLink="/auth/register"
                routerLinkActive="active"
                role="tab"
                [attr.aria-selected]="isRegisterRoute()"
                class="auth-tab"
            >
                Crear cuenta
            </a>
        </div>

        <router-outlet />
    </div>

    <app-modal-error-message />
</section>
