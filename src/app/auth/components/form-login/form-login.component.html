<div class="container-form">

    <h1 class="title-form">Iniciar sesión</h1>

    <form [formGroup]="loginForm" (submit)="onLogin()" class="form-auth">
        
        <form-error-label class="error error-email" [control]="loginForm.get('email')!" />
        <input
            type="text"
            placeholder="example@gmail.com"
            class="input-email"
            name="email"
            autocomplete="off"
            formControlName="email"
            required
            [ngClass]="{'hasError': ( loginForm.get('email')?.errors && loginForm.get('email')?.touched ) ?? false }">
        <label class="label-text">Correo Electronico</label>

        <form-error-label class="error error-password" [control]="loginForm.get('password')!" />
        <input type="password" placeholder="unaContraseñaSegur@123" class="input-password" required name="password"
            formControlName="password"
            [ngClass]="{'hasError': ( loginForm.get('password')?.errors  && loginForm.get('password')?.touched ) ?? false }">
        <label class="label-text">Contraseña</label>

        <button class="btn-sumbit" type="submit" (submit)="onLogin()">
            Ingresar
        </button>

        <span class="oauth-divider">o continuá con</span>
        <div class="btns-oauth">
            <button type="button" class="btn-oauth btn-oauth-google">
                <img src="assets/google-icon.svg" alt="">
                Continuar con Google
            </button>
            <button type="button" class="btn-oauth btn-oauth-github">
                <img src="assets/github-icon.svg" alt="">
                Continuar con GitHub
            </button>
        </div>

        <a class="text-forgot-pass underline" href="">
            ¿Olvidaste tu contraseña?
        </a>

        <p class="text-register">
            ¿Todavia no tienes una cuenta?
            <a [routerLink]="['/auth/register']" class="underline">
                Registrate.
            </a>
        </p>

    </form>
</div>
