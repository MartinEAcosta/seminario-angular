<div class="container-content">
    @if( enrollmentState.isLoading() ){
        <div class="container-loader">
            <app-loader />
        </div>
    }
    @else if( enrollmentState.error() ){
        <div class="container-loader">
            <h1 class="error-text">No pudimos cargar esta inscripción. Intentá de nuevo más tarde.</h1>
        </div>
    }
    @else if( enrollmentState.selectedEnrollment(); as enrollment ){
        <app-list-of-content [courseId]="enrollment.course.id_course" />

        <div class="container-media">
            <!-- TODO: el visor de lecciones queda pendiente: LessonState todavía no expone
                 `selectedLesson`. Ver lesson/state/lesson-state.ts antes de reactivar esto. -->
        </div>
    }
</div>
