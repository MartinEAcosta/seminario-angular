@if ( isVerified() ) {
    <!-- En modo flush el badge de la card padre ya informa "Correo verificado": repetirlo acá sería ruido. -->
    @if ( !flush() ) {
        <div class="container-banner verified">
            <span class="icon">✓</span>
            <p class="text-banner">Tu email <strong>{{ userState.user()?.email }}</strong> ya está validado.</p>
        </div>
    }
}
@else {
    <div class="container-banner not-verified" [class.flush]="flush()">
        <span class="icon">!</span>
        <div class="content-banner">
            <p class="banner-title">Validá tu correo</p>
            <p class="text-banner-secondary">
                Lo necesitás para pedir el pase de profesor y usar otras funciones de tu cuenta.
            </p>
        </div>
        <button
            class="btn-send-verification"
            type="button"
            [disabled]="isSending() || cooldown() > 0"
            (click)="onSendVerificationEmail()"
        >
            <span class="btn-icon" aria-hidden="true">
                @if ( isSending() ) {
                    <span class="btn-spinner"></span>
                }
                @else {
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3.5 11.5 20.5 3.5 16 20.5 11 13 3.5 11.5Z"/>
                        <path d="M11 13 20.5 3.5"/>
                    </svg>
                }
            </span>
            <span class="btn-label">
                @if ( isSending() ) {
                    Enviando...
                }
                @else if ( cooldown() > 0 ) {
                    Reenviar en {{ cooldown() }}s
                }
                @else {
                    Enviar email de validación
                }
            </span>
        </button>
    </div>
}
