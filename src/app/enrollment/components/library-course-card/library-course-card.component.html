<article class="card view-grid">
    <figure class="thumb">
        <img class="thumb-img" [src]="enrollment().course.thumbnail_url" alt="" loading="lazy">
        <span class="category-badge">{{ item().category_name }}</span>
        @if ( isCompleted() ) {
            <span class="completed-badge">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 12.5l5 5L20 6.5"/>
                </svg>
                Completado
            </span>
        }
    </figure>

    <div class="body">
        <h3 class="title">
            <a [routerLink]="['/enrollment', enrollment().id]">{{ enrollment().course.title }}</a>
        </h3>
        <p class="meta">{{ metaText() }}</p>

        <div class="progress-track">
            <div class="progress-fill" [style.width.%]="enrollment().progress"></div>
        </div>

        <div class="footer">
            <span class="footer-label" [class.is-empty]="isNotStarted()">{{ footerLabel() }}</span>
            <a class="btn" [class.btn-outline]="isCompleted()" [routerLink]="['/enrollment', enrollment().id]">
                {{ buttonLabel() }}
            </a>
        </div>
    </div>
</article>

<a class="row view-list" [routerLink]="['/enrollment', enrollment().id]">
    <figure class="row-thumb">
        <img class="thumb-img" [src]="enrollment().course.thumbnail_url" alt="" loading="lazy">
    </figure>

    <div class="row-body">
        <p class="row-title">{{ enrollment().course.title }}</p>
        <p class="row-meta">{{ metaText() }}</p>
        @if ( !isCompleted() ) {
            <div class="row-progress">
                <div class="row-progress-fill" [style.width.%]="enrollment().progress"></div>
            </div>
        }
    </div>

    <span class="row-status" [class.is-done]="isCompleted()" [attr.aria-label]="buttonLabel()">
        @if ( isCompleted() ) {
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 1 1 3 6.7"/>
                <path d="M3 21v-5h5"/>
            </svg>
        }
        @else {
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
                <path d="M6 4.5v15l12-7.5z"/>
            </svg>
        }
    </span>
</a>
