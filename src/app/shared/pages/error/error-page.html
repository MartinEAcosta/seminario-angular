<section class="shell-error">

    <div class="panel-signal">
        <span class="eyebrow">{{ safeEyebrow() }}</span>
        <p class="code-error" aria-hidden="true">
            <span class="digit">{{ codeLead() }}</span><span class="digit accent">{{ codeAccent() }}</span>
        </p>
        <p class="badge-pill">
            @switch ( iconKind() ) {
                @case ('search') {
                    <svg class="badge-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="m19.5 19.5-3.6-3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                }
                @default {
                    <svg class="badge-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M12 4.3 2.9 20.1h18.2L12 4.3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        <path d="M12 10.2v3.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M12 17.2h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                }
            }
            {{ safeBadge() }}
        </p>
    </div>

    <div class="panel-divider" aria-hidden="true"></div>

    <div class="panel-recovery">
        <h1>{{ safeTitle() }}</h1>
        <p class="recovery-text">{{ safeMessage() }}</p>

        <div class="recovery-actions">
            <a routerLink="/" class="btn-primary">Ir al inicio →</a>
            <a routerLink="/explore" class="btn-outline">Explorar cursos</a>
        </div>

        <div class="recovery-divider"></div>

        <span class="eyebrow">O seguí por acá</span>
        <nav class="recovery-links" aria-label="Enlaces alternativos">
            <a routerLink="/">Inicio</a>
            <a routerLink="/explore">Explorar cursos</a>
            <a routerLink="/about">Sobre nosotros</a>
        </nav>
    </div>

</section>
