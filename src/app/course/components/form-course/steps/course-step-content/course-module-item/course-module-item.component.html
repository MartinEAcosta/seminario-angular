<div class="module-item" [class.expanded]="isExpanded()">

    @if( !isEditingModule() ){
        <div class="module-header">
            <span class="module-drag-handle" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="9" cy="6" r="1.5" />
                    <circle cx="15" cy="6" r="1.5" />
                    <circle cx="9" cy="12" r="1.5" />
                    <circle cx="15" cy="12" r="1.5" />
                    <circle cx="9" cy="18" r="1.5" />
                    <circle cx="15" cy="18" r="1.5" />
                </svg>
            </span>
            <button type="button" class="module-toggle" (click)="toggleExpand()">
                <img class="expand-icon" [class.rotated]="isExpanded()" src="/assets/expand-icon.svg" alt="">
                <span class="module-title">Módulo {{ module().unit }} : {{ module().title }}</span>
            </button>

            <app-publish-status-menu
                [isHidden]="isModuleHidden()"
                publishedLabel="Publicado"
                draftLabel="Borrador"
                entityLabel="módulo"
                (toggleVisibility)="toggleModuleVisibility()"
                (edit)="onEditModule()"
            />
        </div>
    }
    @else {
        <app-save-module
            [idCourse]="idCourse()"
            [moduleToEdit]="module()"
            [existingModules]="allModules()"
            (saved)="onModuleSaved($event)"
            (cancelled)="isEditingModule.set(false)"
        />
    }

    @if( isExpanded() ){
        <div class="module-body">

            @for( lesson of module().lessons ; track lesson.id ){
                @if( editingLessonId() === lesson.id ){
                    <div class="lesson-panel">
                        <app-form-lesson
                            [idCourse]="idCourse()"
                            (saved)="onLessonSaved()"
                            (cancelled)="closeLessonPanel()"
                        />
                    </div>
                }
                @else {
                    <div class="lesson-row">
                        <span class="lesson-drag-handle" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <circle cx="9" cy="6" r="1.5" />
                                <circle cx="15" cy="6" r="1.5" />
                                <circle cx="9" cy="12" r="1.5" />
                                <circle cx="15" cy="12" r="1.5" />
                                <circle cx="9" cy="18" r="1.5" />
                                <circle cx="15" cy="18" r="1.5" />
                            </svg>
                        </span>
                        <div class="lesson-info" (click)="onEditLesson( lesson )">
                            <span class="lesson-thumb" aria-hidden="true">
                                <svg class="lesson-thumb-icon" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M8 5v14l11-7z" />
                                </svg>
                            </span>
                            <div class="lesson-text">
                                <span class="lesson-title">{{ lesson.title }}</span>
                                <span class="lesson-duration">Video · --:--</span>
                            </div>
                        </div>
                        <app-publish-status-menu
                            [isHidden]="lessonFormState.isLessonHidden(lesson.id)"
                            publishedLabel="Publicada"
                            draftLabel="Borrador"
                            entityLabel="lección"
                            [showDelete]="true"
                            (toggleVisibility)="lessonFormState.toggleLessonVisibility(lesson.id)"
                            (edit)="onEditLesson(lesson)"
                            (deleteItem)="onDeleteLesson(lesson)"
                        />
                    </div>
                }
            }

            @if( isAddingLesson() ){
                <div class="lesson-panel no-notch">
                    <app-form-lesson
                        [idCourse]="idCourse()"
                        (saved)="onLessonSaved()"
                        (cancelled)="closeLessonPanel()"
                    />
                </div>
            }
            @else {
                <button type="button" class="btn-add-lesson" (click)="onAddLesson()">
                    + Agregar lección
                </button>
            }

        </div>
    }

</div>
