<div class="container-referral">
    <p class="text-referral">¿Tiene un cupón de descuento? Ingresalo Aquí.</p>
    <div class="input-row" [class.shake]="status() === 'error'">
        <input
            type="text"
            placeholder="CURSOS-2025"
            aria-label="Código de cupón de descuento"
            [formControl]="codeControl"
            (keydown.enter)="onApply()">
        <button
            type="button"
            class="btn-apply"
            [class.is-applying]="status() === 'applying'"
            [disabled]="status() === 'applying' || !codeControl.value.trim()"
            (click)="onApply()">
            {{ status() === 'applying' ? 'Aplicando…' : 'Aplicar' }}
        </button>
    </div>
    @if( status() === 'applied' ){
        <p class="status-message status-success">Cupón aplicado.</p>
    }
    @if( status() === 'error' ){
        <p class="status-message status-error">No se pudo aplicar el cupón.</p>
    }
</div>
